<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order System Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .test-result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        code { background: #f8f9fa; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="mb-4">Orders System Integration Test</h1>

    <!-- Test 1: Checkout Service -->
    <div class="test-section">
        <h3>Test 1: Checkout Service Initialization</h3>
        <button class="btn btn-primary" onclick="testServiceInit()">Run Test</button>
        <div id="test1-result"></div>
    </div>

    <!-- Test 2: Cart Operations -->
    <div class="test-section">
        <h3>Test 2: Cart Operations</h3>
        <button class="btn btn-primary" onclick="testCartOps()">Run Test</button>
        <div id="test2-result"></div>
    </div>

    <!-- Test 3: Order Submission -->
    <div class="test-section">
        <h3>Test 3: Order Submission</h3>
        <button class="btn btn-primary" onclick="testOrderSubmission()">Run Test</button>
        <div id="test3-result"></div>
    </div>

    <!-- Test 4: Manual Checkout -->
    <div class="test-section">
        <h3>Test 4: Manual Checkout Form</h3>
        <p class="text-muted">Test order creation manually</p>
        
        <form id="test-checkout-form">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Product ID</label>
                        <input type="number" class="form-control" id="product_id" value="1" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="quantity" value="1" min="1" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Product Price</label>
                        <input type="number" step="0.01" class="form-control" id="price" value="49.99" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="product_name" value="Test Product" required>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-info btn-sm" onclick="addTestItemToCart()">
                Add to Cart
            </button>
            <span id="cart-status" class="ms-3"></span>
        </form>

        <hr class="my-4">

        <form id="manual-checkout" onsubmit="submitTestOrder(event)">
            <h5 class="mb-3">Checkout Details</h5>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Full Name*</label>
                        <input type="text" name="customer_name" class="form-control" value="John Doe" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Email*</label>
                        <input type="email" name="customer_email" class="form-control" value="john@test.com" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="customer_phone" class="form-control" value="555-1234">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="payment_method" class="form-select">
                            <option value="credit_card">Credit Card</option>
                            <option value="debit_card">Debit Card</option>
                            <option value="paypal">PayPal</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Shipping Address*</label>
                <textarea name="shipping_address" class="form-control" rows="3" required>123 Main Street, City, State 12345</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Billing Address</label>
                <textarea name="billing_address" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-success btn-lg">
                Place Test Order
            </button>
        </form>

        <div id="checkout-result" class="mt-3"></div>
    </div>

    <!-- Test Results Summary -->
    <div class="test-section alert alert-info">
        <h5>Quick Links</h5>
        <ul class="mb-0">
            <li><a href="/admin/orders" target="_blank">View Admin Orders Panel</a></li>
            <li><a href="/api/orders" target="_blank">API Endpoint (requires auth)</a></li>
            <li><a href="javascript:window.location.reload()">Reload Page</a></li>
        </ul>
    </div>
</div>

<!-- Scripts -->
<script src="/frontend/checkout.js"></script>
<script>
    function testServiceInit() {
        const resultDiv = document.getElementById('test1-result');
        try {
            if (typeof window.orderCheckout !== 'undefined') {
                resultDiv.innerHTML = `
                    <div class="test-result">
                        <span class="success">✓ Service initialized successfully</span><br>
                        Cart items: ${window.orderCheckout.cartItems.length}<br>
                        Cart total: $${window.orderCheckout.getCartTotal().toFixed(2)}
                    </div>
                `;
            } else {
                resultDiv.innerHTML = '<div class="test-result"><span class="error">✗ Service not found</span></div>';
            }
        } catch (error) {
            resultDiv.innerHTML = `<div class="test-result"><span class="error">✗ Error: ${error.message}</span></div>`;
        }
    }

    function testCartOps() {
        const resultDiv = document.getElementById('test2-result');
        try {
            const initialCount = window.orderCheckout.getCartItemsCount();
            
            // Add item
            window.orderCheckout.addToCart({ id: 1, name: 'Test', price: 10 }, 2);
            const afterAdd = window.orderCheckout.getCartItemsCount();
            
            // Update quantity
            window.orderCheckout.updateQuantity(1, 3);
            const afterUpdate = window.orderCheckout.getCartItemsCount();
            
            // Get total
            const total = window.orderCheckout.getCartTotal();
            
            resultDiv.innerHTML = `
                <div class="test-result">
                    <span class="success">✓ Cart operations working</span><br>
                    Items added: ${afterAdd - initialCount}<br>
                    Total quantity: ${afterUpdate}<br>
                    Cart total: $${total.toFixed(2)}
                </div>
            `;
            
            // Clean up
            window.orderCheckout.clearCart();
        } catch (error) {
            resultDiv.innerHTML = `<div class="test-result"><span class="error">✗ Error: ${error.message}</span></div>`;
        }
    }

    async function testOrderSubmission() {
        const resultDiv = document.getElementById('test3-result');
        try {
            // Add test item
            window.orderCheckout.addToCart({ id: 1, name: 'Test Product', price: 99.99 }, 1);
            
            const testData = {
                customer_name: 'Test User',
                customer_email: 'test@example.com',
                shipping_address: '123 Test St, Test City, TS 12345',
                total_amount: window.orderCheckout.getCartTotal(),
            };
            
            resultDiv.innerHTML = '<div class="test-result"><span>Testing order submission...</span></div>';
            
            const result = await window.orderCheckout.submitOrder(testData);
            
            if (result.success) {
                resultDiv.innerHTML = `
                    <div class="test-result">
                        <span class="success">✓ Order submitted successfully!</span><br>
                        Order Number: <strong>${result.data.order_number}</strong><br>
                        Order ID: ${result.data.order_id}<br>
                        Amount: $${result.data.total_amount}
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="test-result">
                        <span class="error">✗ Submission failed</span><br>
                        ${result.message}<br>
                        ${JSON.stringify(result.errors || {})}
                    </div>
                `;
            }
        } catch (error) {
            resultDiv.innerHTML = `<div class="test-result"><span class="error">✗ Error: ${error.message}</span></div>`;
        }
    }

    function addTestItemToCart() {
        const productId = parseInt(document.getElementById('product_id').value);
        const quantity = parseInt(document.getElementById('quantity').value);
        const price = parseFloat(document.getElementById('price').value);
        const name = document.getElementById('product_name').value;
        
        window.orderCheckout.addToCart({ id: productId, name, price }, quantity);
        
        document.getElementById('cart-status').innerHTML = `
            <span class="success">✓ Added ${quantity}x ${name}</span><br>
            <small>Cart total: $${window.orderCheckout.getCartTotal().toFixed(2)}</small>
        `;
    }

    async function submitTestOrder(event) {
        event.preventDefault();
        const resultDiv = document.getElementById('checkout-result');
        const form = document.getElementById('manual-checkout');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData);
        
        resultDiv.innerHTML = '<div class="test-result"><span>Processing order...</span></div>';
        
        const result = await window.orderCheckout.submitOrder({
            ...data,
            total_amount: window.orderCheckout.getCartTotal(),
        });
        
        if (result.success) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <h5>✓ Order Placed Successfully!</h5>
                    <p><strong>Order Number:</strong> ${result.data.order_number}</p>
                    <p><strong>Order ID:</strong> ${result.data.order_id}</p>
                    <p><strong>Total:</strong> $${result.data.total_amount}</p>
                    <a href="/admin/orders" class="btn btn-sm btn-primary">View in Admin Panel</a>
                </div>
            `;
            form.reset();
            window.orderCheckout.clearCart();
        } else {
            resultDiv.innerHTML = `
                <div class="alert alert-danger">
                    <h5>✗ Order Failed</h5>
                    <p>${result.message}</p>
                    ${Object.keys(result.errors || {}).length > 0 ? `<pre>${JSON.stringify(result.errors, null, 2)}</pre>` : ''}
                </div>
            `;
        }
    }

    // Run initial test on page load
    window.addEventListener('load', () => {
        console.log('Page loaded, OrderCheckout service:', window.orderCheckout);
    });
</script>
</body>
</html>
